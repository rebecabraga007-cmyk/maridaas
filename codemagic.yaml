workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    integrations:
      app_store_connect: Maridas
    environment:
      xcode: 26.2
      node: 22.12.0
      ios_signing:
        provisioning_profiles:
          - "maridas provi"
        certificates:
          - "maridas cert"
      vars:
        BUNDLE_ID: "com.healthmedia.maridas"
        APPLE_APP_ID: "6766708263"
        APPLE_TEAM_ID: "22M7YZ5TMF"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        # Base marketing version (MAJOR.MINOR). Patch is auto-incremented per build.
        MARKETING_BASE_VERSION: "1.1"
    scripts:
      - name: Install dependencies
        script: |
          set -e
          # Workaround for npm optional-deps bug (rollup native binaries):
          # https://github.com/npm/cli/issues/4828
          rm -rf node_modules package-lock.json
          npm install

      - name: Build web assets
        script: |
          set -e
          CAPACITOR=true npm run build
          if [ ! -d "dist" ] && [ ! -d "build" ] && [ ! -d "out" ]; then
            echo "ERROR: no web build output"
            exit 1
          fi

      - name: Ensure Capacitor config exists
        script: |
          set -e
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            echo "ERROR: capacitor config missing"
            exit 1
          fi

      - name: Recreate iOS platform from scratch
        script: |
          set -e
          rm -rf ios
          npx cap add ios || { echo "ERROR: cap add ios failed"; exit 1; }
          npx cap sync ios || { echo "ERROR: cap sync ios failed"; exit 1; }

          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "ERROR: IOS_GENERATION_FAILED — ios/App/App.xcodeproj missing"
            exit 1
          fi

          echo "--- iOS tree ---"
          find ios -maxdepth 5 \( -name "Podfile" -o -name "Package.swift" -o -name "*.xcodeproj" -o -name "*.xcworkspace" \)

      - name: Generate native app icons
        script: |
          set -e
          npx -y @capacitor/assets generate --ios --iconBackgroundColor '#5BA69A' --iconBackgroundColorDark '#5BA69A'

      - name: Detect iOS dependency manager (CocoaPods vs SPM)
        script: |
          set -e
          IOS_APP_DIR="ios/App"

          if [ -f "$IOS_APP_DIR/Podfile" ]; then
            DEP_MANAGER="cocoapods"
            BUILD_CONTAINER="$IOS_APP_DIR/App.xcworkspace"
            BUILD_FLAG="-workspace"
          elif [ -d "$IOS_APP_DIR/App.xcworkspace" ]; then
            DEP_MANAGER="spm"
            BUILD_CONTAINER="$IOS_APP_DIR/App.xcworkspace"
            BUILD_FLAG="-workspace"
          else
            DEP_MANAGER="spm"
            BUILD_CONTAINER="$IOS_APP_DIR/App.xcodeproj"
            BUILD_FLAG="-project"
          fi

          echo "Detected dependency manager: $DEP_MANAGER"
          echo "Build container: $BUILD_FLAG $BUILD_CONTAINER"

          echo "IOS_APP_DIR=$IOS_APP_DIR" >> $CM_ENV
          echo "DEP_MANAGER=$DEP_MANAGER" >> $CM_ENV
          echo "BUILD_CONTAINER=$BUILD_CONTAINER" >> $CM_ENV
          echo "BUILD_FLAG=$BUILD_FLAG" >> $CM_ENV

      - name: Install iOS dependencies
        script: |
          set -e
          if [ "$DEP_MANAGER" = "cocoapods" ]; then
            cd "$IOS_APP_DIR"
            pod install || (pod repo update && pod install)
          else
            echo "SPM — Xcode resolves packages during archive"
          fi

      - name: Validate signing assets
        script: |
          set -e
          echo "--- Code signing identities ---"
          security find-identity -v -p codesigning
          echo "--- Installed provisioning profiles ---"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
          DIST_COUNT=$(security find-identity -v -p codesigning | grep -c "Apple Distribution" || true)
          if [ "$DIST_COUNT" -lt 1 ]; then
            echo "ERROR: Apple Distribution identity missing"
            exit 1
          fi

      - name: Increment build & marketing version
        script: |
          set -e
          cd "$IOS_APP_DIR"
          PLIST="App/Info.plist"
          PBXPROJ="App.xcodeproj/project.pbxproj"

          # CFBundleVersion (build number) — strictly increasing, based on epoch minutes
          BUILD_NUMBER=$(($(date +%s) / 60))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
          echo "Set CFBundleVersion to $BUILD_NUMBER"

          # Persist for downstream IPA validation step
          printf '%s' "$BUILD_NUMBER" > /tmp/ios_build_number.txt
          if [ -n "$CM_ENV" ]; then
            echo "IOS_BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"
          fi

          # Export compliance: app uses only standard HTTPS/TLS encryption (exempt).
          # Declaring this avoids manual prompt in App Store Connect and the
          # "missing export compliance" error when submitting to TestFlight review.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          echo "Set ITSAppUsesNonExemptEncryption to false"
          # Also update CURRENT_PROJECT_VERSION in pbxproj (Xcode uses this for $(CURRENT_PROJECT_VERSION))
          sed -i.bak -E "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" "$PBXPROJ"

          # Capacitor's Info.plist uses $(MARKETING_VERSION). Read & write the actual value
          # from project.pbxproj so the bumped value is honored at archive time.
          CURRENT_VERSION=$(grep -E "MARKETING_VERSION = " "$PBXPROJ" | head -n1 | sed -E 's/.*MARKETING_VERSION = ([^;]+);.*/\1/' | tr -d ' ')
          if [ -z "$CURRENT_VERSION" ] || ! echo "$CURRENT_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            CURRENT_VERSION="1.0.0"
          fi
          echo "Current MARKETING_VERSION: $CURRENT_VERSION"

          # Override MAJOR.MINOR with MARKETING_BASE_VERSION when provided (e.g. "1.1")
          if [ -n "$MARKETING_BASE_VERSION" ] && echo "$MARKETING_BASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            MAJOR=$(echo "$MARKETING_BASE_VERSION" | awk -F. '{print $1}')
            MINOR=$(echo "$MARKETING_BASE_VERSION" | awk -F. '{print $2}')
            echo "Overriding MAJOR.MINOR with MARKETING_BASE_VERSION=$MARKETING_BASE_VERSION"
          else
            MAJOR=$(echo "$CURRENT_VERSION" | awk -F. '{print ($1==""?1:$1)}')
            MINOR=$(echo "$CURRENT_VERSION" | awk -F. '{print ($2==""?0:$2)}')
          fi
          LOCAL_PATCH=$(echo "$CURRENT_VERSION" | awk -F. '{print ($3==""?0:$3)}')

          # Fetch ALL App Store Versions with their states using python (robust JSON parse).
          # Apple blocks attaching a new build to a version in WAITING_FOR_REVIEW / IN_REVIEW /
          # PENDING_DEVELOPER_RELEASE — we must bump *above* any such version, not reuse it.
          LATEST_REMOTE=""
          BLOCKING_STATE=""
          if command -v app-store-connect >/dev/null 2>&1 && [ -n "$APPLE_APP_ID" ]; then
            ASC_JSON=$(app-store-connect apps app-store-versions "$APPLE_APP_ID" --json 2>/dev/null || echo "")
            if [ -n "$ASC_JSON" ]; then
              echo "--- App Store Versions found ---"
              # Parse JSON robustly: extract versionString + appStoreState pairs.
              # Use grep + paste — no Python indentation pitfalls.
              echo "$ASC_JSON" \
                | tr ',' '\n' \
                | grep -Eo '"(versionString|appStoreState|app_store_state|state|version_string)"[[:space:]]*:[[:space:]]*"[^"]*"' \
                | sed -E 's/.*"([^"]+)"[[:space:]]*:[[:space:]]*"([^"]+)"/\1=\2/' \
                > /tmp/asc_pairs.txt 2>/dev/null || true
              # Reconstruct rows: every versionString followed by next state-ish key.
              awk -F= '
                /^(versionString|version_string)=/ { v=$2; next }
                /^(appStoreState|app_store_state|state)=/ { if (v!="" && v ~ /^[0-9]+\.[0-9]+\.[0-9]+$/) print v"\t"$2; v="" }
              ' /tmp/asc_pairs.txt > /tmp/asc_versions.tsv 2>/dev/null || true
              cat /tmp/asc_versions.tsv || true
              LATEST_REMOTE=$(awk -F'\t' '{print $1}' /tmp/asc_versions.tsv | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)
              BLOCKING_STATE=$(awk -F'\t' -v maj="$MAJOR" -v min="$MINOR" '
                $1 ~ "^"maj"\\."min"\\." && ($2=="WAITING_FOR_REVIEW" || $2=="IN_REVIEW" || $2=="PENDING_DEVELOPER_RELEASE") {print $1":"$2; exit}
              ' /tmp/asc_versions.tsv)
              echo "Latest remote App Store Version: ${LATEST_REMOTE:-none}"
              [ -n "$BLOCKING_STATE" ] && echo "Blocking version detected: $BLOCKING_STATE (cannot reuse — will bump above it)"
            else
              echo "WARN: app-store-connect returned no JSON; falling back to local patch"
            fi
          fi

          REMOTE_PATCH=0
          if [ -n "$LATEST_REMOTE" ]; then
            R_MAJOR=$(echo "$LATEST_REMOTE" | awk -F. '{print $1}')
            R_MINOR=$(echo "$LATEST_REMOTE" | awk -F. '{print $2}')
            R_PATCH=$(echo "$LATEST_REMOTE" | awk -F. '{print $3}')
            if [ "$R_MAJOR" = "$MAJOR" ] && [ "$R_MINOR" = "$MINOR" ]; then
              REMOTE_PATCH=$R_PATCH
            fi
          fi

          BASE_PATCH=$LOCAL_PATCH
          if [ "$REMOTE_PATCH" -gt "$BASE_PATCH" ]; then
            BASE_PATCH=$REMOTE_PATCH
          fi
          # Always +1 so we never collide with a locked remote version.
          NEW_PATCH=$((BASE_PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "Local patch=$LOCAL_PATCH  Remote patch=$REMOTE_PATCH  -> New version=$NEW_VERSION"

          # Validate format (must be 1-3 non-negative integers)
          if ! echo "$NEW_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Computed invalid CFBundleShortVersionString: $NEW_VERSION"
            exit 1
          fi

          # Update MARKETING_VERSION in pbxproj (source of truth for Capacitor)
          sed -i.bak -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $NEW_VERSION;/g" "$PBXPROJ"
          rm -f "$PBXPROJ.bak"

          # Also overwrite CFBundleShortVersionString in Info.plist with the literal value
          # (replacing the $(MARKETING_VERSION) reference) as a belt-and-suspenders measure.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $NEW_VERSION" "$PLIST"
          echo "Set MARKETING_VERSION / CFBundleShortVersionString to $NEW_VERSION"

          echo "--- pbxproj versions ---"
          grep -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION" "$PBXPROJ" | sort -u

      - name: Apply provisioning profiles to Xcode project
        script: |
          set -e
          xcode-project use-profiles \
            --project "$XCODE_PROJECT" \
            --archive-method app-store \
            --code-signing-setup-verbose-logging

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH=$(find "$PROFILE_DIR" -name "*.mobileprovision" -print -quit)
          if [ -z "$PROFILE_PATH" ]; then
            echo "ERROR: No provisioning profile installed"
            exit 1
          fi

          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          echo "CM_PROFILE_NAME=$PROFILE_NAME" >> "$CM_ENV"
          echo "Using provisioning profile: $PROFILE_NAME"

      - name: Archive (xcodebuild, Codemagic manual signing)
        script: |
          set -e
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "ERROR: APPLE_TEAM_ID not set"
            exit 1
          fi
          echo "Using DEVELOPMENT_TEAM=$APPLE_TEAM_ID"
          echo "Using PROVISIONING_PROFILE_SPECIFIER=$CM_PROFILE_NAME"
          mkdir -p "$CM_BUILD_DIR"

          # Resolve the Apple Distribution identity SHA from the keychain
          DIST_SHA=$(security find-identity -v -p codesigning | grep "Apple Distribution" | head -n1 | awk '{print $2}')
          if [ -z "$DIST_SHA" ]; then
            echo "ERROR: Could not find Apple Distribution identity SHA"
            exit 1
          fi
          echo "Using CODE_SIGN_IDENTITY SHA=$DIST_SHA"

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            clean archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$CM_PROFILE_NAME" \
            CODE_SIGN_IDENTITY="$DIST_SHA"

      - name: Export IPA
        script: |
          set -e
          EXPORT_DIR="$CM_BUILD_DIR/build/ipa"
          PLIST="$CM_BUILD_DIR/export_options.plist"
          mkdir -p "$EXPORT_DIR"

          cat > "$PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$CM_PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          echo "--- export_options.plist ---"
          cat "$PLIST"

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$PLIST"

          echo "--- IPA output ---"
          ls -la "$EXPORT_DIR"

      - name: Validate IPA CFBundleVersion matches pipeline value
        script: |
          set -e
          EXPORT_DIR="$CM_BUILD_DIR/build/ipa"
          EXPECTED="${IOS_BUILD_NUMBER:-$(cat /tmp/ios_build_number.txt 2>/dev/null || true)}"
          if [ -z "$EXPECTED" ]; then
            echo "ERROR: expected iOS CFBundleVersion not found (IOS_BUILD_NUMBER unset)"
            exit 1
          fi

          IPA_PATH=$(ls "$EXPORT_DIR"/*.ipa 2>/dev/null | head -n1)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: no .ipa produced in $EXPORT_DIR"
            exit 1
          fi
          echo "Validating IPA: $IPA_PATH"
          echo "Expected CFBundleVersion: $EXPECTED"

          WORK_DIR=$(mktemp -d)
          unzip -q "$IPA_PATH" -d "$WORK_DIR"
          APP_PLIST=$(ls "$WORK_DIR"/Payload/*.app/Info.plist 2>/dev/null | head -n1)
          if [ -z "$APP_PLIST" ]; then
            echo "ERROR: Info.plist not found inside IPA"
            exit 1
          fi

          ACTUAL=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PLIST" | tr -dc '0-9')
          ACTUAL_SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PLIST" || true)

          echo "Actual CFBundleVersion in IPA: $ACTUAL"
          echo "Actual CFBundleShortVersionString in IPA: $ACTUAL_SHORT"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: IPA CFBundleVersion mismatch. Expected $EXPECTED, got $ACTUAL"
            exit 1
          fi
          echo "OK — IPA CFBundleVersion ($ACTUAL) matches pipeline value ($EXPECTED)"
    artifacts:
      - $CM_BUILD_DIR/build/ipa/*.ipa
      - $CM_BUILD_DIR/App.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true

  android-release:
    name: Android Release
    max_build_duration: 60
    environment:
      java: 21
      node: 22.11.0
      android_signing:
        - healthmedia
      groups:
        - google_play
    scripts:
      - name: Install dependencies
        script: |
          set -e
          rm -rf node_modules package-lock.json
          npm install
      - name: Build web assets
        script: CAPACITOR=true npm run build
      - name: Ensure Capacitor Android packages
        script: |
          set -e
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            echo "ERROR: capacitor config missing"
            exit 1
          fi
      - name: Recreate Android platform from scratch
        script: |
          set -e
          rm -rf android
          npx cap add android || { echo "ERROR: cap add android failed"; exit 1; }
          npx cap sync android || { echo "ERROR: cap sync android failed"; exit 1; }
          if [ ! -f "android/app/build.gradle" ]; then
            echo "ERROR: ANDROID_GENERATION_FAILED — android/app/build.gradle missing"
            exit 1
           fi
      - name: Override Android applicationId for Google Play
        script: |
          set -e
          # iOS bundle id: com.healthmedia.maridas (App Store)
          # Android applicationId: com.maridas.app (Google Play — already registered)
          # Capacitor scaffolds Android using the iOS appId; we override here.
          ANDROID_APP_ID="com.maridas.app"
          sed -i.bak -E "s/applicationId \"[^\"]+\"/applicationId \"$ANDROID_APP_ID\"/" android/app/build.gradle
          sed -i.bak -E "s/namespace \"[^\"]+\"/namespace \"$ANDROID_APP_ID\"/" android/app/build.gradle
          rm -f android/app/build.gradle.bak
          echo "--- applicationId / namespace after override ---"
          grep -E "applicationId|namespace" android/app/build.gradle
      - name: Generate native app icons
        script: |
          set -e
          npx -y @capacitor/assets generate --android --iconBackgroundColor '#5BA69A' --iconBackgroundColorDark '#5BA69A'
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Configure release signing
        script: |
          set -e
          cd android/app
          cat > /tmp/signing.gradle <<'EOF'
          signingConfigs {
              release {
                  if (System.getenv("CM_KEYSTORE_PATH")) {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
          }
          EOF
          awk '/^android \{/{print; while ((getline line < "/tmp/signing.gradle") > 0) print "    " line; next} {print}' build.gradle > build.gradle.new
          mv build.gradle.new build.gradle
          sed -i.bak 's|buildTypes {|buildTypes {\
          release { signingConfig signingConfigs.release }|' build.gradle
          rm -f build.gradle.bak
          echo "--- signingConfigs / buildTypes ---"
          grep -n "signingConfig\|buildTypes\|storeFile" build.gradle || true
      - name: Prepare Android versionCode
        script: |
          set -e
          ANDROID_APP_ID="com.maridas.app"

          # Native Android versionCode — unique, increasing and separated from versionName.
          # Capacitor recreates android/app/build.gradle on every build, so this step patches
          # the generated native Gradle file before bundleRelease. No random numbers are used.
          KNOWN_USED_FLOOR=1788379270
          HIGH_BASE_VERSION_CODE=2050000000
          MAX_VERSION_CODE=2100000000
          EPOCH_BASE_SECONDS=1735689600

          NOW_SECONDS=$(date +%s)
          TIME_SLOT=$(( (NOW_SECONDS - EPOCH_BASE_SECONDS) / 6 ))
          [ "$TIME_SLOT" -lt 0 ] && TIME_SLOT=0
          LOCAL=$(( HIGH_BASE_VERSION_CODE + TIME_SLOT ))

          BUILD_NUM=0
          BUILD_SOURCE="none"
          for v in CM_BUILD_NUMBER BUILD_NUMBER GITHUB_RUN_NUMBER BITRISE_BUILD_NUMBER; do
            VAL=$(printenv "$v" 2>/dev/null || true)
            if echo "$VAL" | grep -Eq '^[0-9]+$' && [ "$VAL" -gt 0 ]; then
              BUILD_NUM="$VAL"
              BUILD_SOURCE="$v"
              break
            fi
          done
          if [ "$BUILD_NUM" -gt 0 ]; then
            BUILD_CANDIDATE=$(( HIGH_BASE_VERSION_CODE + BUILD_NUM ))
            if [ "$BUILD_CANDIDATE" -gt "$LOCAL" ] && [ "$BUILD_CANDIDATE" -lt "$MAX_VERSION_CODE" ]; then
              LOCAL="$BUILD_CANDIDATE"
            fi
          fi
          if [ "$LOCAL" -le "$KNOWN_USED_FLOOR" ]; then
            LOCAL=$(( KNOWN_USED_FLOOR + 1 ))
          fi
          if [ "$LOCAL" -ge "$MAX_VERSION_CODE" ]; then
            echo "ERROR: local versionCode $LOCAL exceeds Android max $MAX_VERSION_CODE"
            exit 1
          fi

          echo "Known used floor: $KNOWN_USED_FLOOR"
          echo "High base: $HIGH_BASE_VERSION_CODE  Time slot: $TIME_SLOT  Build source: $BUILD_SOURCE=$BUILD_NUM"
          echo "Local candidate versionCode: $LOCAL"

          echo "--- Env vars potentially holding Google Play credentials ---"
          env | grep -iE 'google|gcloud|play' | awk -F= '{print $1}' || true

          CRED_VAR=""
          CRED_JSON=""
          for v in GCLOUD_SERVICE_ACCOUNT_CREDENTIALS GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS GOOGLE_PLAY_SERVICE_ACCOUNT_JSON GOOGLE_PLAY_JSON_KEY GCP_SA_KEY; do
            VAL=$(printenv "$v" 2>/dev/null || true)
            if [ -n "$VAL" ]; then
              CRED_VAR="$v"
              CRED_JSON="$VAL"
              echo "Detected credentials in env var: $CRED_VAR"
              break
            fi
          done

          REMOTE=0
          REMOTE_OK=0
          if [ -n "$CRED_VAR" ] && command -v google-play >/dev/null 2>&1; then
            printf '%s' "$CRED_JSON" > /tmp/gp_creds.raw
            cat > /tmp/normalize_creds.py <<'PY'
          import json, sys
          raw = open('/tmp/gp_creds.raw').read().strip()
          try:
              obj = json.loads(raw)
          except Exception:
              obj = json.loads(raw.replace('\\n', '\n'))
          sys.stdout.write(json.dumps(obj))
          PY
            CRED_JSON_NORMALIZED=$(python3 /tmp/normalize_creds.py)
            RC=$?
            rm -f /tmp/gp_creds.raw /tmp/normalize_creds.py
            if [ $RC -ne 0 ] || [ -z "$CRED_JSON_NORMALIZED" ]; then
              echo "ERROR: $CRED_VAR does not contain valid JSON. Recreate it as the full service account JSON."
              exit 1
            fi

            set +e
            REMOTE_RAW=$(google-play get-latest-build-number \
              --credentials "$CRED_JSON_NORMALIZED" \
              --package-name "$ANDROID_APP_ID" \
              --tracks internal alpha beta production 2>&1)
            RC=$?
            if [ $RC -ne 0 ]; then
              REMOTE_RAW=$(google-play get-latest-build-number \
                --credentials "$CRED_JSON_NORMALIZED" \
                --package-name "$ANDROID_APP_ID" 2>&1)
              RC=$?
            fi
            set -e
            if [ $RC -eq 0 ]; then
              REMOTE=$(echo "$REMOTE_RAW" | grep -Eo '[0-9]+' | sort -n | tail -n1)
              [ -z "$REMOTE" ] && REMOTE=0
              REMOTE_OK=1
              echo "Remote latest versionCode (Google Play): $REMOTE"
            else
              echo "WARN: google-play CLI failed — using high timestamp/build candidate"
              echo "$REMOTE_RAW"
            fi
          else
            echo "WARN: Google Play lookup unavailable — using high timestamp/build candidate"
          fi

          VERSION_CODE="$LOCAL"
          if [ "$REMOTE_OK" = "1" ] && [ "$REMOTE" -ge "$VERSION_CODE" ]; then
            VERSION_CODE=$(( REMOTE + 1 ))
          fi
          if [ "$VERSION_CODE" -ge "$MAX_VERSION_CODE" ]; then
            echo "ERROR: final versionCode $VERSION_CODE exceeds Android max $MAX_VERSION_CODE"
            exit 1
          fi

          export GENERATED_VERSION_CODE="$VERSION_CODE"
          export ANDROID_VERSION_CODE="$VERSION_CODE"
          printf '%s' "$VERSION_CODE" > /tmp/android_version_code.txt
          if [ -n "${CM_ENV:-}" ]; then
            echo "GENERATED_VERSION_CODE=$VERSION_CODE" >> "$CM_ENV"
            echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$CM_ENV"
          fi

          cd android
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle")
          text = path.read_text()
          block = '''
          def resolveGeneratedVersionCode = {
              long maxVersionCode = 2100000000L
              long knownUsedFloor = 1788379270L
              long highBaseVersionCode = 2050000000L
              long epochBaseSeconds = 1735689600L
              long nowSeconds = (System.currentTimeMillis() / 1000L) as long
              long timeSlotCandidate = highBaseVersionCode + Math.max(0L, Math.floorDiv(nowSeconds - epochBaseSeconds, 6L))
              long envCandidate = 0L

              ["GENERATED_VERSION_CODE", "ANDROID_VERSION_CODE", "VERSION_CODE"].each { name ->
                  def value = System.getenv(name)
                  if (value != null && value ==~ /\\d+/) {
                      envCandidate = Math.max(envCandidate, value.toLong())
                  }
              }
              ["CM_BUILD_NUMBER", "BUILD_NUMBER", "GITHUB_RUN_NUMBER", "BITRISE_BUILD_NUMBER"].each { name ->
                  def value = System.getenv(name)
                  if (value != null && value ==~ /\\d+/) {
                      long candidate = highBaseVersionCode + value.toLong()
                      if (candidate < maxVersionCode) {
                          envCandidate = Math.max(envCandidate, candidate)
                      }
                  }
              }

              long code = [knownUsedFloor + 1L, timeSlotCandidate, envCandidate].max()
              if (code >= maxVersionCode) {
                  throw new GradleException("Generated versionCode ${code} exceeds Android max ${maxVersionCode}")
              }
              return code as int
          }
          def generatedVersionCode = resolveGeneratedVersionCode()
          println "Generated Android versionCode: ${generatedVersionCode}"
          '''

          if "def generatedVersionCode = resolveGeneratedVersionCode()" not in text:
              text = text.replace("android {", block + "\nandroid {", 1)

          text, count = re.subn(r"versionCode\s+\d+", "versionCode generatedVersionCode", text, count=1)
          if count == 0:
              text, count = re.subn(r"versionCode\s+[A-Za-z_][A-Za-z0-9_]*", "versionCode generatedVersionCode", text, count=1)
          if count == 0:
              raise SystemExit("ERROR: versionCode line not found in android/app/build.gradle")
          path.write_text(text)
          PY

          echo "Final Android versionCode selected: $VERSION_CODE"
          echo "--- Android native version fields after patch ---"
          grep -E "generatedVersionCode|versionCode|versionName" app/build.gradle
      - name: Build AAB (release)
        script: |
          set -e
          EXPECTED_VERSION_CODE="${GENERATED_VERSION_CODE:-$(cat /tmp/android_version_code.txt 2>/dev/null || true)}"
          if [ -z "$EXPECTED_VERSION_CODE" ]; then
            echo "ERROR: expected Android versionCode not found"
            exit 1
          fi

          cd android
          chmod +x gradlew
          rm -rf app/build build .gradle
          ./gradlew clean :app:bundleRelease --no-build-cache --rerun-tasks

          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" -type f | sort | tail -n1)
          if [ -z "$AAB_PATH" ]; then
            echo "ERROR: release AAB not generated"
            exit 1
          fi
          AAB_COUNT=$(find app/build/outputs/bundle/release -name "*.aab" -type f | wc -l | tr -d ' ')
          if [ "$AAB_COUNT" -ne 1 ]; then
            echo "ERROR: expected exactly one fresh AAB, found $AAB_COUNT"
            find app/build/outputs/bundle/release -name "*.aab" -type f -print
            exit 1
          fi

          if command -v bundletool >/dev/null 2>&1; then
            ACTUAL_VERSION_CODE=$(bundletool dump manifest --bundle "$AAB_PATH" --xpath '/manifest/@android:versionCode' | tr -dc '0-9')
          else
            BUNDLETOOL_JAR="/tmp/bundletool-all-1.17.2.jar"
            if [ ! -f "$BUNDLETOOL_JAR" ]; then
              curl -fsSL -o "$BUNDLETOOL_JAR" "https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar"
            fi
            ACTUAL_VERSION_CODE=$(java -jar "$BUNDLETOOL_JAR" dump manifest --bundle "$AAB_PATH" --xpath '/manifest/@android:versionCode' | tr -dc '0-9')
          fi

          if [ -z "$ACTUAL_VERSION_CODE" ]; then
            echo "ERROR: could not read versionCode from generated AAB"
            exit 1
          fi
          if [ "$ACTUAL_VERSION_CODE" != "$EXPECTED_VERSION_CODE" ]; then
            echo "ERROR: AAB versionCode mismatch. Expected $EXPECTED_VERSION_CODE, got $ACTUAL_VERSION_CODE"
            exit 1
          fi
          echo "Final AAB: $AAB_PATH"
          echo "Final AAB versionCode: $ACTUAL_VERSION_CODE"
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
