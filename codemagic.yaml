workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    integrations:
      app_store_connect: Maridas
    environment:
      xcode: 26.2
      node: 22.12.0
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.healthmedia.maridas"
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build web assets
        script: npm run build

      - name: Ensure iOS platform exists
        script: |
          if [ ! -d "ios/App" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update

      - name: Set up signing keychain
        script: |
          set -e
          KEYCHAIN_PATH="$HOME/Library/Keychains/build.keychain-db"
          security create-keychain -p "" build.keychain || true
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 \
            -k build.keychain \
            -P "$CM_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Install provisioning profile
        script: |
          set -e
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode > /tmp/profile.mobileprovision

          # Extract UUID + Name from profile
          PROFILE_PLIST=$(security cms -D -i /tmp/profile.mobileprovision)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$PROFILE_PLIST")

          cp /tmp/profile.mobileprovision "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"

          echo "Installed profile: $PROFILE_NAME ($PROFILE_UUID)"
          echo "PROFILE_NAME=$PROFILE_NAME" >> $CM_ENV
          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV

      - name: Debug signing assets
        script: |
          echo "--- Code signing identities ---"
          security find-identity -v -p codesigning
          echo "--- Installed provisioning profiles ---"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
          echo "Using PROFILE_NAME=$PROFILE_NAME"
          echo "Using PROFILE_UUID=$PROFILE_UUID"
          echo "Using TEAM=$APPLE_TEAM_ID"
          echo "Using BUNDLE_ID=$BUNDLE_ID"

      - name: Increment build number
        script: |
          cd ios/App
          BUILD_NUMBER=$(($(date +%s) / 60))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" App/Info.plist
          echo "Set CFBundleVersion to $BUILD_NUMBER"

      - name: Archive (xcodebuild)
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/build"
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -destination "generic/platform=iOS" \
            clean archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export IPA
        script: |
          set -e
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          mkdir -p "$CM_BUILD_DIR/build/ipa"
          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ipa" \
            -exportOptionsPlist /tmp/ExportOptions.plist

          echo "--- IPA output ---"
          ls -la "$CM_BUILD_DIR/build/ipa"
    artifacts:
      - $CM_BUILD_DIR/build/ipa/*.ipa
      - $CM_BUILD_DIR/build/App.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  android-release:
    name: Android Release
    max_build_duration: 60
    environment:
      java: 17
      node: 22.11.0
      android_signing:
        - trinity_keystore
      groups:
        - google_play
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Ensure Android platform exists
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Increment version code
        script: |
          cd android
          VERSION_CODE=$(($(date +%s) / 60))
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" app/build.gradle
      - name: Build AAB (release)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
