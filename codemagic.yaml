workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    integrations:
      app_store_connect: Maridas
    environment:
      xcode: 26.2
      node: 22.12.0
      ios_signing:
        provisioning_profiles:
          - "maridas provi"
        certificates:
          - "maridas cert"
      vars:
        BUNDLE_ID: "com.healthmedia.maridas"
        APPLE_TEAM_ID: "22M7YZ5TMF"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm ci || npm install

      - name: Build web assets
        script: |
          set -e
          npm run build
          if [ ! -d "dist" ] && [ ! -d "build" ] && [ ! -d "out" ]; then
            echo "ERROR: no web build output"
            exit 1
          fi

      - name: Ensure Capacitor packages
        script: |
          set -e
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            echo "ERROR: capacitor config missing"
            exit 1
          fi

      - name: Recreate iOS platform from scratch
        script: |
          set -e
          rm -rf ios
          npx cap add ios || { echo "ERROR: cap add ios failed"; exit 1; }
          npx cap sync ios || { echo "ERROR: cap sync ios failed"; exit 1; }

          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "ERROR: IOS_GENERATION_FAILED — ios/App/App.xcodeproj missing"
            exit 1
          fi

          echo "--- iOS tree ---"
          find ios -maxdepth 5 \( -name "Podfile" -o -name "Package.swift" -o -name "*.xcodeproj" -o -name "*.xcworkspace" \)

      - name: Generate native app icons
        script: |
          set -e
          npx -y @capacitor/assets generate --ios --iconBackgroundColor '#5BA69A' --iconBackgroundColorDark '#5BA69A'

      - name: Detect iOS dependency manager (CocoaPods vs SPM)
        script: |
          set -e
          IOS_APP_DIR="ios/App"

          if [ -f "$IOS_APP_DIR/Podfile" ]; then
            DEP_MANAGER="cocoapods"
            BUILD_CONTAINER="$IOS_APP_DIR/App.xcworkspace"
            BUILD_FLAG="-workspace"
          elif [ -d "$IOS_APP_DIR/App.xcworkspace" ]; then
            DEP_MANAGER="spm"
            BUILD_CONTAINER="$IOS_APP_DIR/App.xcworkspace"
            BUILD_FLAG="-workspace"
          else
            DEP_MANAGER="spm"
            BUILD_CONTAINER="$IOS_APP_DIR/App.xcodeproj"
            BUILD_FLAG="-project"
          fi

          echo "Detected dependency manager: $DEP_MANAGER"
          echo "Build container: $BUILD_FLAG $BUILD_CONTAINER"

          echo "IOS_APP_DIR=$IOS_APP_DIR" >> $CM_ENV
          echo "DEP_MANAGER=$DEP_MANAGER" >> $CM_ENV
          echo "BUILD_CONTAINER=$BUILD_CONTAINER" >> $CM_ENV
          echo "BUILD_FLAG=$BUILD_FLAG" >> $CM_ENV

      - name: Install iOS dependencies
        script: |
          set -e
          if [ "$DEP_MANAGER" = "cocoapods" ]; then
            cd "$IOS_APP_DIR"
            pod install || (pod repo update && pod install)
          else
            echo "SPM — Xcode resolves packages during archive"
          fi

      - name: Validate signing assets
        script: |
          set -e
          echo "--- Code signing identities ---"
          security find-identity -v -p codesigning
          echo "--- Installed provisioning profiles ---"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
          DIST_COUNT=$(security find-identity -v -p codesigning | grep -c "Apple Distribution" || true)
          if [ "$DIST_COUNT" -lt 1 ]; then
            echo "ERROR: Apple Distribution identity missing"
            exit 1
          fi

      - name: Increment build number
        script: |
          set -e
          cd "$IOS_APP_DIR"
          BUILD_NUMBER=$(($(date +%s) / 60))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" App/Info.plist
          echo "Set CFBundleVersion to $BUILD_NUMBER"

      - name: Apply provisioning profiles to Xcode project
        script: |
          set -e
          xcode-project use-profiles \
            --project "$XCODE_PROJECT" \
            --archive-method app-store \
            --code-signing-setup-verbose-logging

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH=$(find "$PROFILE_DIR" -name "*.mobileprovision" -print -quit)
          if [ -z "$PROFILE_PATH" ]; then
            echo "ERROR: No provisioning profile installed"
            exit 1
          fi

          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          echo "CM_PROFILE_NAME=$PROFILE_NAME" >> "$CM_ENV"
          echo "Using provisioning profile: $PROFILE_NAME"

      - name: Archive (xcodebuild, Codemagic manual signing)
        script: |
          set -e
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "ERROR: APPLE_TEAM_ID not set"
            exit 1
          fi
          echo "Using DEVELOPMENT_TEAM=$APPLE_TEAM_ID"
          echo "Using PROVISIONING_PROFILE_SPECIFIER=$CM_PROFILE_NAME"
          mkdir -p "$CM_BUILD_DIR"

          # Resolve the Apple Distribution identity SHA from the keychain
          DIST_SHA=$(security find-identity -v -p codesigning | grep "Apple Distribution" | head -n1 | awk '{print $2}')
          if [ -z "$DIST_SHA" ]; then
            echo "ERROR: Could not find Apple Distribution identity SHA"
            exit 1
          fi
          echo "Using CODE_SIGN_IDENTITY SHA=$DIST_SHA"

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            clean archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$CM_PROFILE_NAME" \
            CODE_SIGN_IDENTITY="$DIST_SHA"

      - name: Export IPA
        script: |
          set -e
          EXPORT_DIR="$CM_BUILD_DIR/build/ipa"
          PLIST="$CM_BUILD_DIR/export_options.plist"
          mkdir -p "$EXPORT_DIR"

          cat > "$PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$CM_PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          echo "--- export_options.plist ---"
          cat "$PLIST"

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$PLIST"

          echo "--- IPA output ---"
          ls -la "$EXPORT_DIR"
    artifacts:
      - $CM_BUILD_DIR/build/ipa/*.ipa
      - $CM_BUILD_DIR/App.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  android-release:
    name: Android Release
    max_build_duration: 60
    environment:
      java: 21
      node: 22.11.0
      android_signing:
        - healthmedia
      groups:
        - google_play
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Ensure Capacitor Android packages
        script: |
          set -e
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            echo "ERROR: capacitor config missing"
            exit 1
          fi
      - name: Recreate Android platform from scratch
        script: |
          set -e
          rm -rf android
          npx cap add android || { echo "ERROR: cap add android failed"; exit 1; }
          npx cap sync android || { echo "ERROR: cap sync android failed"; exit 1; }
          if [ ! -f "android/app/build.gradle" ]; then
            echo "ERROR: ANDROID_GENERATION_FAILED — android/app/build.gradle missing"
            exit 1
          fi
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Configure release signing
        script: |
          set -e
          cd android/app
          cat > /tmp/signing.gradle <<'EOF'
          signingConfigs {
              release {
                  if (System.getenv("CM_KEYSTORE_PATH")) {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
          }
          EOF
          awk '/^android \{/{print; while ((getline line < "/tmp/signing.gradle") > 0) print "    " line; next} {print}' build.gradle > build.gradle.new
          mv build.gradle.new build.gradle
          sed -i.bak 's|buildTypes {|buildTypes {\
          release { signingConfig signingConfigs.release }|' build.gradle
          rm -f build.gradle.bak
          echo "--- signingConfigs / buildTypes ---"
          grep -n "signingConfig\|buildTypes\|storeFile" build.gradle || true
      - name: Increment version code
        script: |
          set -e
          cd android
          VERSION_CODE=$(($(date +%s) / 60))
          sed -i.bak "s/versionCode [0-9][0-9]*/versionCode $VERSION_CODE/" app/build.gradle
          rm -f app/build.gradle.bak
          echo "--- versionCode after substitution ---"
          grep "versionCode" app/build.gradle
      - name: Build AAB (release)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
